# Configuração de Segurança Nginx para VPS + Next.js em Docker
# Localização recomendada na VPS: /etc/nginx/sites-available/radar-unificando

# ----------------------------------------------------------------------
# 1. ZONAS DE RATE LIMITING (Camada 1 de Proteção na VPS)
# ----------------------------------------------------------------------
# Guarda IPs em memória compartilhada (10MB armazena ~160.000 IPs)
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=chat_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

# Formato personalizado de resposta quando atingir o limite no Nginx (HTTP 429)
limit_req_status 429;

# Upstream para o container da aplicação Next.js
upstream nextjs_app {
    server 127.0.0.1:11010 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# Redirecionamento HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name radar.unificando.com.br www.radar.unificando.com.br;

    # Ocultar versão do Nginx por segurança
    server_tokens off;

    # Certbot challenge for Let's Encrypt SSL
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Configuração HTTPS Principal
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name radar.unificando.com.br www.radar.unificando.com.br;

    # Ocultar versão do Nginx por segurança
    server_tokens off;

    # ------------------------------------------------------------------
    # 2. CERTIFICADOS SSL / TLS (Gerado via Certbot / Let's Encrypt)
    # ------------------------------------------------------------------
    # ssl_certificate /etc/letsencrypt/live/radar.unificando.com.br/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/radar.unificando.com.br/privkey.pem;
    # ssl_dhparam /etc/nginx/dhparam.pem;

    # Protocolos e Ciphers modernos e seguros
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # ------------------------------------------------------------------
    # 3. CABEÇALHOS DE SEGURANÇA OWASP
    # ------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    
    # CSP básico (Ajuste conforme suas necessidades de scripts externos)
    # Domínios de terceiros em script-src: obrigatórios para o GA4, o tracking
    # da Impact (utt.impactcdn.com) e o Cloudflare Web Analytics
    # (static.cloudflareinsights.com) não serem bloqueados pelo CSP (validação 13/08, item V-1).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://utt.impactcdn.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:;" always;

    # ------------------------------------------------------------------
    # 4. HARDENING CONTRA ATAQUES DE BUFFER OVERFLOW / DOS
    # ------------------------------------------------------------------
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    client_max_body_size 10m;
    large_client_header_buffers 4 8k;

    # Timeouts contra conexões lentas (Slowloris attacks)
    client_body_timeout 12s;
    client_header_timeout 12s;
    keepalive_timeout 15s;
    send_timeout 10s;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_proxied any;
    gzip_min_length 1000;

    # ------------------------------------------------------------------
    # 5. ROTAS COM RATE LIMITING ESPECÍFICO
    # ------------------------------------------------------------------

    # Rota sensível da API de Chat/IA (Máximo 10 requisições/minuto)
    # Match exato: subrotas como /api/chat/history, /api/chat/context,
    # /api/chat/conversations e /api/chat/usage NÃO devem cair aqui —
    # elas caem no location / (general_limit), pois são operações leves
    # de leitura/histórico, não chamadas ao LLM.
    location = /api/chat {
        limit_req zone=chat_limit burst=3 nodelay;

        proxy_pass http://nextjs_app;
        proxy_http_version 1.1;

        # Suporte a Streaming SSE da OpenAI/AI SDK
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Desativar buffer para respostas de streaming da IA
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Rota de Cadastro / Auth (Máximo 5 requisições/minuto para barrar brute-force)
    location /api/auth/register {
        limit_req zone=auth_limit burst=2 nodelay;

        proxy_pass http://nextjs_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rota de Arquivos Estáticos (_next/static) com Cache Longo
    location /_next/static/ {
        proxy_pass http://nextjs_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Demais Rotas Gerais da Aplicação
    location / {
        limit_req zone=general_limit burst=20 nodelay;

        proxy_pass http://nextjs_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Suporte a WebSockets se necessário
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Upload de currículo faz chamada síncrona à LLM (pode levar até ~2min em modelos
        # de raciocínio). Sem isso o default de 60s do Nginx derruba a conexão com 504 antes da resposta chegar.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

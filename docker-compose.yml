services:
  app:
    build: .
    ports:
      - "11010:11010"
    volumes:
      - data:/app/data
    environment:
      - DATABASE_URL=/app/data/radar.db
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:11010/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  data:
